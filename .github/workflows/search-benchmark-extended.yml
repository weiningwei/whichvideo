name: Extended search benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_HOME: ${{ github.workspace }}/tmp/search-benchmark/cargo-home
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies and FFmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The benchmark runs Cargo with --offline, so fetch dependencies first.
      - run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml
      - name: Ensure FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          $ffmpeg = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if (-not $ffmpeg) {
            $ffmpeg = (Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg' -Recurse -Filter ffmpeg.exe -File | Select-Object -First 1).FullName
          }
          $ffprobe = (Get-Command ffprobe -ErrorAction SilentlyContinue).Source
          if (-not $ffprobe) { $ffprobe = Join-Path (Split-Path $ffmpeg) 'ffprobe.exe' }
          if (-not (Test-Path $ffmpeg) -or -not (Test-Path $ffprobe)) { throw 'FFmpeg/ffprobe not found' }
          "WHICHVIDEO_FFMPEG=$ffmpeg" >> $env:GITHUB_ENV
          "WHICHVIDEO_FFPROBE=$ffprobe" >> $env:GITHUB_ENV
          & $ffmpeg -version | Select-Object -First 1
      - name: Ensure FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Run extended search benchmark
        run: pnpm test:search:extended
      - name: Upload benchmark manifest and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-benchmark-extended-${{ matrix.os }}
          path: |
            tmp/search-benchmark/run-*/dataset/manifest.json
            tmp/search-benchmark/run-*/dataset/report.json
          if-no-files-found: warn
          retention-days: 14
