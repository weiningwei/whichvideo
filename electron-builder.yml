appId: com.weiningwei.whichvideo
productName: WhichVideo
copyright: Copyright © 2026 weiningwei

directories:
  output: release
  buildResources: build

# 关闭打包前的原生模块重建。
# 原因：better-sqlite3 v12+ 使用 Node-API 预编译二进制（prebuilds/win32-x64.node），
# 同一份文件在 Node 与 Electron 下都能直接加载，不需要针对 Electron 重新编译。
# 而 @electron/rebuild 会 fork 子进程，在某些环境/沙箱里直接失败（spawn EPERM），
# 导致整个打包中断 —— 从而出现"看起来打包成功、实际是上一次的旧产物"这种坑。
npmRebuild: false

files:
  - out/**
  - package.json
  - LICENSE

asarUnpack:
  - node_modules/better-sqlite3/**

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'

win:
  target:
    # 安装包（数据写在 %APPDATA%）
    - target: nsis
      arch:
        - x64
    # 免安装目录版：产出 release/win-unpacked，exe 就地运行，
    # 数据写在 <exe 同级>\data —— 这就是绿色/便携形态（见 scripts/build-portable-folder.mjs）
    - target: dir
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WhichVideo

# 说明：这里刻意不使用 electron-builder 的 portable 目标（单文件自解压 exe）。
# 那个形态每次启动都要把整个应用解压到 %TEMP% 并在退出时删除，
# 启动慢、且无法同时运行两份。免安装目录版没有解压环节，启动即秒开。
# 需要单文件分发时再临时加回 portable 目标即可。
