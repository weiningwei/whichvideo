appId: com.weiningwei.whichvideo
productName: WhichVideo
copyright: Copyright © 2026 weiningwei

directories:
  output: release
  buildResources: build

# 关闭打包前的原生模块重建。
# 原因：better-sqlite3 v12+ 使用 Node-API 预编译二进制（prebuilds/win32-x64.node），
# 同一份文件在 Node 与 Electron 下都能直接加载，不需要针对 Electron 重新编译。
# 而 @electron/rebuild 会 fork 子进程，在某些环境/沙箱里直接失败（spawn EPERM），
# 导致整个打包中断 —— 从而出现"看起来打包成功、实际是上一次的旧产物"这种坑。
npmRebuild: false

# 复用 %LOCALAPPDATA%\electron\Cache 里的 Electron 运行时，不要每次重新下载。
#
# 背景：@electron/get 命中缓存后**还要下载 SHASUMS256.txt 做 SHA256 校验**，
# 而那个校验文件是「Never use the cache」硬编码的（见 @electron/get dist/index.js）。
# 于是只要 github.com 连不上（本机实测 10s ConnectTimeout），校验必然失败，
# 接着 falling back to re-download —— 明明缓存里躺着 158MB 的 zip 还是要重下一遍，
# 日志表现为 `downloading label=electron` + 100% 进度条，很有迷惑性。
#
# unsafelyDisableChecksums 关掉那步联网校验。代价是不再验 zip 完整性，
# 风险很低：缓存里是同一台机器上次从官方下载的产物、同一版本；真损坏的话
# electron-builder 后续解包会直接报错，不会悄悄装进一个坏运行时。删缓存重下即可恢复。
electronDownload:
  unsafelyDisableChecksums: true

# 打包后钩子：移除 electron-builder 自动生成的 app-update.yml。
# 它从 git remote/package.json 推断出 provider=github 的更新源配置 ——
# 本项目不用 electron-updater（见 scripts/after-pack.cjs 注释），
# 产物里留着会让 test:network 的「产物无更新源」断言失败。
afterPack: scripts/after-pack.cjs

files:
  - out/**
  - package.json
  - LICENSE
  # better-sqlite3 自带 8 份预编译二进制（darwin/linux/linuxmusl/win32 ×
  # x64/arm64，合计约 25MB），本应用只发布 Windows x64 —— 其余 7 份纯属
  # 体积负担。先整体排除再单独放行 win32-x64。
  - '!node_modules/better-sqlite3/prebuilds/*'
  - 'node_modules/better-sqlite3/prebuilds/win32-x64.node'

# Chromium 默认带 55 个语言包（约 49MB），本应用界面只有中文与英文两种 ——
# 只保留 zh-CN 与 en-US，其余 53 个语言包直接不打进产物。
electronLanguages:
  - zh-CN
  - en-US

asarUnpack:
  - node_modules/better-sqlite3/**

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'

win:
  # 图标由 scripts/generate-icon.mjs 生成到 build/icon.ico（16~256 多尺寸）。
  # 省略时 electron-builder 会用 Electron 默认图标，任务栏与开始菜单会是一坨默认物。
  icon: build/icon.ico
  target:
    # 安装包（数据写在 %APPDATA%）
    - target: nsis
      arch:
        - x64
    # 免安装目录版：产出 release/win-unpacked，exe 就地运行，
    # 数据写在 <exe 同级>\data —— 这就是绿色/便携形态（见 scripts/build-portable-folder.mjs）
    - target: dir
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WhichVideo

# 说明：这里刻意不使用 electron-builder 的 portable 目标（单文件自解压 exe）。
# 那个形态每次启动都要把整个应用解压到 %TEMP% 并在退出时删除，
# 启动慢、且无法同时运行两份。免安装目录版没有解压环节，启动即秒开。
# 需要单文件分发时再临时加回 portable 目标即可。
