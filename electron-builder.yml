appId: com.weiningwei.whichvideo
productName: WhichVideo
copyright: Copyright © 2026 weiningwei

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - LICENSE

asarUnpack:
  - node_modules/better-sqlite3/**

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'

win:
  target:
    # 安装包（数据写在 %APPDATA%）
    - target: nsis
      arch:
        - x64
    # 免安装目录版：产出 release/win-unpacked，exe 就地运行，
    # 数据写在 <exe 同级>\data —— 这就是绿色/便携形态（见 scripts/build-portable-folder.mjs）
    - target: dir
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WhichVideo

# 说明：这里刻意不使用 electron-builder 的 portable 目标（单文件自解压 exe）。
# 那个形态每次启动都要把整个应用解压到 %TEMP% 并在退出时删除，
# 启动慢、且无法同时运行两份。免安装目录版没有解压环节，启动即秒开。
# 需要单文件分发时再临时加回 portable 目标即可。
